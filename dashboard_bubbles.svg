  <rect x="574" y="174" width="245" height="56" rx="16" ry="16" fill="#000000"/>
  <path d="M 574 194 L 539 202 L 579 210" fill="#000000"/>
  <!-- Foreground Yellow Box -->
  <path d="M 570 190 L 535 198 L 575 206" fill="#FFE45C" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
