  <rect x="250" y="315" width="22" height="26" fill="#FFE45C"/>
  <text x="150" y="333" class="bubble-text" text-anchor="middle">Building AI-powered solutions ⚡</text>

  <!-- Central Girl Astronaut riding the rocket (with floating effect) -->
  <g class="floating-astronaut">
    <image href="mission_control_girl.png" x="290" y="75" width="250" height="250"/>
