  <rect x="560" y="300" width="240" height="56" rx="16" ry="16" fill="#FFE45C" stroke="#000000" stroke-width="3"/>
  <rect x="555" y="315" width="22" height="26" fill="#FFE45C"/>
  <text x="680" y="333" class="bubble-text" text-anchor="middle">Kerala, India 📍</text>
</svg>
