  <rect x="250" y="55" width="22" height="26" fill="#FFE45C"/>
  <text x="150" y="73" class="bubble-text" text-anchor="middle">MSc Data Science (VIT Vellore) 🎓</text>

  <!-- 2. BUBBLE 2 (Middle Left) -->
  <!-- Black Shadow -->
  <rect x="24" y="174" width="250" height="56" rx="16" ry="16" fill="#000000"/>
  <path d="M 274 194 L 309 202 L 269 210" fill="#000000"/>
  <!-- Foreground Yellow Box -->
  <path d="M 270 190 L 305 198 L 265 206" fill="#FFE45C" stroke="#000000" stroke-width="3" stroke-linejoin="round"/>
  <rect x="20" y="170" width="250" height="56" rx="16" ry="16" fill="#FFE45C" stroke="#000000" stroke-width="3"/>
  <rect x="250" y="185" width="22" height="26" fill="#FFE45C"/>
  <text x="145" y="203" class="bubble-text" text-anchor="middle">Business Analyst | Data Analyst 📊</text>

