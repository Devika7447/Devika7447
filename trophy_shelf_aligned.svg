<svg width="830" height="160" viewBox="0 0 830 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap');
      .sans-font {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .trophy-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #FFB800;
        letter-spacing: 1px;
      }
      .trophy-desc {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 500;
        font-size: 10px;
        fill: #888888;
      }
      @keyframes float-trophy {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
        100% { transform: translateY(0px); }
      }
      .floating-trophy {
        animation: float-trophy 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Shelf Line -->
  <line x1="50" y1="110" x2="780" y2="110" stroke="#FFC83D" stroke-width="4" stroke-linecap="round"/>
  <!-- Shelf shadow/reflection line -->
  <line x1="80" y1="115" x2="750" y2="115" stroke="#444444" stroke-width="2" stroke-linecap="round"/>

  <!-- Trophy 1 (Left): YIP Winner (Floating) -->
  <g transform="translate(180, 20)">
    <g class="floating-trophy">
      <!-- Base -->
      <path d="M 25 80 L 55 80 L 50 85 L 30 85 Z" fill="#666666"/>
      <rect x="33" y="70" width="14" height="10" fill="#E5E0D8"/>
      <!-- Stem -->
      <rect x="37" y="55" width="6" height="15" fill="#FFC83D"/>
      <!-- Bowl -->
      <path d="M 25 25 C 25 55, 55 55, 55 25 Z" fill="#FFB800" stroke="#FFC83D" stroke-width="1.5"/>
      <path d="M 20 30 C 15 30, 15 45, 25 45" stroke="#FFB800" stroke-width="2" fill="none"/>
      <path d="M 60 30 C 65 30, 65 45, 55 45" stroke="#FFB800" stroke-width="2" fill="none"/>
      <!-- Star on Trophy -->
      <path d="M 40 32 L 41 35 L 44 35 L 42 37 L 43 40 L 40 38 L 37 40 L 38 37 L 36 35 L 39 35 Z" fill="#FFFDF8"/>
    </g>
  </g>

  <!-- Trophy 2 (Center): State Participant (Floating) -->
  <g style="animation-delay: 1s;" transform="translate(415, 10)">
    <g class="floating-trophy">
      <!-- Base -->
      <path d="M -15 90 L 15 90 L 10 95 L -10 95 Z" fill="#666666"/>
      <rect x="-7" y="80" width="14" height="10" fill="#E5E0D8"/>
      <!-- Stem -->
      <rect x="-3" y="60" width="6" height="20" fill="#FFB800"/>
      <!-- Star Shape -->
      <path d="M 0 20 L 5 32 L 18 32 L 8 40 L 12 52 L 0 44 L -12 52 L -8 40 L -18 32 L -5 32 Z" fill="#FFC83D" stroke="#FFB800" stroke-width="2"/>
      <!-- Tiny Inner Star Highlight -->
      <path d="M 0 27 L 2 33 L 8 33 L 3 37 L 5 43 L 0 39 L -5 43 L -3 37 L -8 33 L -2 33 Z" fill="#FFFDF8"/>
    </g>
  </g>

  <!-- Trophy 3 (Right): GitHub Trophies (Floating) -->
  <g style="animation-delay: 2s;" transform="translate(610, 20)">
    <g class="floating-trophy">
      <!-- Base -->
      <path d="M 25 80 L 55 80 L 50 85 L 30 85 Z" fill="#666666"/>
      <rect x="33" y="70" width="14" height="10" fill="#E5E0D8"/>
      <!-- Stem -->
      <rect x="37" y="55" width="6" height="15" fill="#FFC83D"/>
      <!-- Ring / Planet Bowl -->
      <circle cx="40" cy="38" r="14" fill="#FFB800" stroke="#FFC83D" stroke-width="1.5"/>
      <ellipse cx="40" cy="38" rx="20" ry="5" stroke="#FFC83D" stroke-width="2" fill="none" transform="rotate(-15 40 38)"/>
    </g>
  </g>

  <!-- Static Text Labels (Anchored below the shelf to prevent floating & overlap) -->
  <g>
    <!-- Left Trophy Labels -->
    <text x="220" y="132" class="trophy-title" text-anchor="middle">YIP DISTRICT WINNER</text>
    <text x="220" y="147" class="trophy-desc" text-anchor="middle">District Champion (Young Innovators)</text>

    <!-- Center Trophy Labels -->
    <text x="415" y="132" class="trophy-title" text-anchor="middle">STATE LEVEL FINALIST</text>
    <text x="415" y="147" class="trophy-desc" text-anchor="middle">State Level Summit Presentation</text>

    <!-- Right Trophy Labels -->
    <text x="650" y="132" class="trophy-title" text-anchor="middle">GITHUB ORBIT</text>
    <text x="650" y="147" class="trophy-desc" text-anchor="middle">Active Open Source Contributions</text>
  </g>
</svg>
