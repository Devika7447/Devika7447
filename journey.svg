<svg width="830" height="150" viewBox="0 0 830 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap');
      .sans-font {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .timeline-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 700;
        font-size: 11px;
        fill: #222222;
      }
      .timeline-date {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 500;
        font-size: 10px;
        fill: #666666;
      }
      @keyframes float-rocket {
        0% { transform: translate(0px, 0px); }
        50% { transform: translate(5px, -5px); }
        100% { transform: translate(0px, 0px); }
      }
      .rocket-animation {
        animation: float-rocket 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Transparent background, no card/border container -->

  <!-- Connecting Timeline Winding Path -->
  <path d="M 80 75 Q 160 30 240 75 T 400 75 T 560 75 T 720 75" stroke="#FFC83D" stroke-width="3" stroke-dasharray="6 4" fill="none"/>

  <!-- Planet 1: Digital Strategy -->
  <g transform="translate(80, 75)">
    <circle cx="0" cy="0" r="10" fill="#FCFBF7" stroke="#FFB800" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#FFC83D"/>
    <text x="0" y="-18" class="timeline-title" text-anchor="middle">DIGITAL STRATEGY</text>
    <text x="0" y="22" class="timeline-date" text-anchor="middle">Apr 24 - Jun 24</text>
    <text x="0" y="34" class="timeline-date" text-anchor="middle" font-weight="bold">InHouse Agency</text>
  </g>

  <!-- Planet 2: BI Intern -->
  <g transform="translate(240, 75)">
    <circle cx="0" cy="0" r="10" fill="#FCFBF7" stroke="#FFB800" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#FFC83D"/>
    <text x="0" y="-18" class="timeline-title" text-anchor="middle">BI INTERN</text>
    <text x="0" y="22" class="timeline-date" text-anchor="middle">Feb 25 - May 25</text>
    <text x="0" y="34" class="timeline-date" text-anchor="middle" font-weight="bold">Frugal Scientific</text>
  </g>

  <!-- Planet 3: System Engineer -->
  <g transform="translate(400, 75)">
    <circle cx="0" cy="0" r="10" fill="#FCFBF7" stroke="#FFB800" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#FFC83D"/>
    <text x="0" y="-18" class="timeline-title" text-anchor="middle">SYSTEM ENGINEER</text>
    <text x="0" y="22" class="timeline-date" text-anchor="middle">Jun 25 - Apr 26</text>
    <text x="0" y="34" class="timeline-date" text-anchor="middle" font-weight="bold">Cognizant</text>
  </g>

  <!-- Planet 4: MSc Data Science -->
  <g transform="translate(560, 75)">
    <circle cx="0" cy="0" r="10" fill="#FCFBF7" stroke="#FFB800" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#FFC83D"/>
    <text x="0" y="-18" class="timeline-title" text-anchor="middle">M.SC DATA SCIENCE</text>
    <text x="0" y="22" class="timeline-date" text-anchor="middle">2026 - Present</text>
    <text x="0" y="34" class="timeline-date" text-anchor="middle" font-weight="bold">VIT Vellore</text>
  </g>

  <!-- Planet 5: Landing / Active -->
  <g transform="translate(720, 75)">
    <circle cx="0" cy="0" r="12" fill="#FFC83D" stroke="#FFB800" stroke-width="3"/>
    <text x="0" y="-20" class="timeline-title" text-anchor="middle" fill="#FFB800">BUILDING AI APPS</text>
    <text x="0" y="24" class="timeline-date" text-anchor="middle">Now Active 🚀</text>
  </g>

  <!-- Flying Rocket Illustration navigating the path -->
  <g transform="translate(620, 45)">
    <g class="rocket-animation">
      <path d="M0 20 L15 0 L30 20 L22 18 L15 25 L8 18 Z" fill="#FFC83D" stroke="#FFB800" stroke-width="1.5"/>
      <path d="M15 0 L15 25" stroke="#FFB800" stroke-width="1"/>
      <!-- Flame -->
      <path d="M10 23 Q15 35 20 23" fill="#FFB800" opacity="0.8"/>
    </g>
  </g>
</svg>
